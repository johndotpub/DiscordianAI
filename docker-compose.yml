services:
  discordianai:
    # Primary: Use GHCR image (GitHub Container Registry)
    image: ghcr.io/johndotpub/discordianai:latest
    # Secondary: Fallback to Docker Hub if needed
    # image: johndotpub/discordianai:latest
    # Alternative: build locally if needed
    # build: .
    container_name: discordianai
    restart: unless-stopped

    # Inject the secrets and settings documented in .env.example. Compose's own
    # .env is only used for variable substitution, so it must be loaded here.
    env_file:
      - .env

    # The bot only reads config.ini; logs go to stdout.
    volumes:
      - ./config.ini:/app/config.ini:ro

    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      # Bind all interfaces inside the container so the published port works.
      - HEALTH_HOST=0.0.0.0

    # Publish the health endpoint on the host loopback only.
    ports:
      - "127.0.0.1:8080:8080"

    # Ask the running bot itself, using only the standard library.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          import urllib.error
          import urllib.request

          try:
              with urllib.request.urlopen(
                  "http://127.0.0.1:8080/health", timeout=5
              ) as response:
                  sys.exit(0 if response.status == 200 else 1)
          except (OSError, urllib.error.URLError):
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Network configuration
    networks:
      - discordianai-network

  # Optional: Add a monitoring service
  # prometheus:
  #   image: ghcr.io/prom/prometheus:latest
  #   container_name: prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   networks:
  #     - discordianai-network

networks:
  discordianai-network:
    driver: bridge
    name: discordianai-network
