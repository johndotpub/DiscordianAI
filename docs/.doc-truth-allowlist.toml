# Documentation drift exceptions. Every entry must name a check, an exact target,
# and a reason. Follow-up notes are optional but expected for temporary gaps.

[[exception]]
check = "B1"
target = "LOG_FILE@config.ini.example"
reason = "LOG_FILE is deprecated and ignored; the example deliberately avoids advertising a dead setting."
follow_up = "Remove LOG_FILE parsing when the backward-compatibility window closes."

[[exception]]
check = "B1"
target = "LOG_FILE@complete-example"
reason = "The complete example omits the deprecated LOG_FILE key for the same reason as config.ini.example."
follow_up = "Remove LOG_FILE parsing when the backward-compatibility window closes."

[[exception]]
check = "B1"
target = "WEB_TOOLS@config.ini.example"
reason = "WEB_TOOLS defaults to true; the example documents the switch in a comment rather than adding a redundant active key."

[[exception]]
check = "B1"
target = "DISCORDIANAI_LOG_COLOR@config.ini.example"
reason = "Colour follows terminal detection when the key is unset; the example documents the switch in a comment instead of shipping an active value that would override detection."

[[exception]]
check = "B1"
target = "DISCORDIANAI_LOG_COLOR@complete-example"
reason = "The complete example keeps the colour key commented out for the same reason: an active value would override terminal detection."

[[exception]]
check = "B1"
target = "OLLAMA_API_KEY@not-in-loader"
reason = "OLLAMA_API_KEY is an environment-only fallback read directly by the routing credential resolver, not a config.ini key; it is documented in .env.example and the environment-variable section of docs/Configuration.md."
follow_up = "Move the fallback into the central loader only if it becomes a supported config.ini key."

[[exception]]
check = "B3"
target = "OLLAMA_API_KEY@.env.example-not-read"
reason = "OLLAMA_API_KEY is an environment-only Clef fallback read directly by the routing credential resolver, not by the config loader; it is documented so operators can supply it without adding a config.ini key."
follow_up = "Move the fallback into the central loader only if it becomes a supported config.ini key."
