# Optimized CI workflow with parallel execution and caching
# Runs tests on Python 3.12 (required)
name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.github/codeql/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.github/codeql/**'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs on same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Primary test suite - Python 3.12 (required to pass)
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Cache tox environments
      uses: actions/cache@v6
      with:
        path: .tox
        key: ${{ runner.os }}-tox-v3-3.12-${{ hashFiles('**/pyproject.toml', '**/tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-tox-v3-3.12-

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Run tests
      run: tox -e py312

    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  # Compatibility tests removed: project now targets Python 3.12+

  # Lint and format check
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install linters
      run: pip install "black>=26.1.0" "ruff>=0.15.4"

    - name: Check formatting (black)
      run: black . --check --diff

    - name: Check linting (ruff)
      run: ruff check . --show-fixes

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install dependencies and scan
      run: |
        pip install -r requirements.txt
        pip install pip-audit
        pip-audit --desc --progress-spinner=off

  # Sphinx documentation build (warnings as errors)
  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install docs dependencies
      run: pip install ".[docs]"

    - name: Build Sphinx docs (warnings as errors)
      run: python -m sphinx -b html docs/api docs/api/_build -W

  # Prove the published artefact installs and runs outside the source checkout
  wheel:
    name: Wheel Install Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Build wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Verify wheel ships the src package
      run: |
        python - <<'PY'
        from pathlib import Path
        import sys
        import zipfile

        wheels = sorted(Path("dist").glob("*.whl"))
        if len(wheels) != 1:
            sys.exit(f"Expected exactly one wheel, found: {wheels}")

        with zipfile.ZipFile(wheels[0]) as archive:
            names = archive.namelist()

        top_level_modules = [name for name in names if "/" not in name and name.endswith(".py")]
        src_modules = [name for name in names if name.startswith("src/") and name.endswith(".py")]
        if top_level_modules or not src_modules:
            print("Wheel must ship a src/ package, not top-level modules.", file=sys.stderr)
            print("\n".join(names), file=sys.stderr)
            sys.exit(1)
        PY

    - name: Install wheel in a clean virtual environment
      run: |
        python -m venv /tmp/wheeltest
        /tmp/wheeltest/bin/pip install dist/*.whl

    - name: Run installed console script
      run: /tmp/wheeltest/bin/discordianai --help

    - name: Run installed module from outside the checkout
      run: |
        cd /tmp
        /tmp/wheeltest/bin/python -m src.main --help
